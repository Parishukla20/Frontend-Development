<!-- color values are:-
default color
rgb - red,green,blue
rgba - red,green,blue,alpha(it is opacity from 0-1) 
hsl - hue(degree of color wheel),saturation(to get original color 100%),lightness(0% is black and 100% is white)
hsla - hue,saturation,lightness,alpha
hexa decimal - combination of totally 16 characters(0-9,a-f)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: rgb(255,0,0);
        }
        h2{
            background-color: rgba(255, 200, 100 , 1);
        }
        h3{
            background-color: hsl(130, 31%, 49%);
        }
        h4{
            background-color: hsla(220, 100%, 49%,1);
        }
        h5{
            background-color: #f123f1;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h4>Hello World</h4>
    <h5>Hello World</h5>
</body>
</html>
