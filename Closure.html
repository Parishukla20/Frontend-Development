<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <script>
        var user = "ExcelR";
        function outermostfun(){
            var x = 10;
            var y = 20;
            console.log(user)
            console.log("print in parent function"+ x,y)

            function innermost(){
                const p = "Hello"
                console.log(p)
                console.log("print in child function:" +x);
                console.log("print in child function" +y);
            }
            innermost();
        }
        outermostfun();
    </script>
</body>
