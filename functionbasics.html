<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function Basics</h1>
    <script>
        //Without formal parameters
        function add(){
            var a = 20;
            var b= 40;
            console.log(a+b)
        }
        add();

        //with formal parameter
        function addition(a,b){
            console.log(a+b)
        }
        addition(40,60)
    </script>
</body>
</html>
