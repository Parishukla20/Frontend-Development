<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operators</h1>
    <script>
        //Arithmatic
        console.log(10+10)//addition
        console.log("10"+10)//concatenation
        console.log(10-5)//subtraction
        console.log("100"-45)//typecasting using subtraction
        console.log("100"-"55")//typecasting using subtraction
        console.log(10*40)//multiplaction
        console.log("10"*"20")//typecasting using multiplication
        console.log(782/10)//division
        console.log(222%11)//modulus
        console.log(10**10)//exponential
        //pre-increament(++a)
        let a = 10;
        console.log(++a)
        //post-increament(a++)
        let b=10;
        console.log(b++)


        //Assignment
        let x = 10;
        console.log(x)
        console.log(x+= 5)
        console.log(x-=5)
        console.log(x*=5)
        console.log(x/=5)
        console.log(x%=2)


        //Logical
        let p = 10,q = 20
        if((p<20) && (q>5)){  //AND
            console.log(true)
        }
        if((p<20) || (q>5)){
            console.log(true)  //OR
        }
        if(p!=q){
            console.log(false)   //NOT EQUAL
        }


        //Relational
        console.log(10 == 10)
        console.log(10 < 10)
        console.log(10 > 10)
        console.log(10 >= 10)
        console.log(10 <= 10)
        console.log("10" != 10)


        //ternary
        // operand 1 ? operand 2 : operand 3;
    </script>
</body>
</html>
