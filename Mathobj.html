<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Math Object</h1>
    <script>
        
        //random()
        console.log(Math);
        console.log(Math.PI);
        let r = Math.random();
        console.log(r);

        let r1 = Math.random()*10;
        console.log(r1);

        let r2 = Math.random()*100;
        console.log(r2);

        let r3 = Math.random()*1000;
        console.log(r3);

        let r4 = Math.random()*10000;
        console.log(r4);

        //round()
        let r5 = Math.round(Math.random()*10000);
        console.log(r5);
        console.log(Math.round(10));
        console.log(Math.round(10.1));
        console.log(Math.round(10.3));
        console.log(Math.round(10.4));
        console.log(Math.round(10.49));

        console.log(Math.round(10.5));
        console.log(Math.round(10.6));
        console.log(Math.round(10.9999));

        //floor()
        console.log(Math.floor(10.1));
        console.log(Math.floor(10.5));
        console.log(Math.floor(10.9));
        console.log(Math.floor(10.99999));

        //ceil()
        console.log(Math.ceil(5.1));
        console.log(Math.ceil(5.5));
        console.log(Math.ceil(5.999));

        //trunc()
        console.log(Math.trunc(5.34));
        console.log(Math.trunc(8.1));
        console.log(Math.trunc(8.999));

        //abs()
        console.log(Math.abs(10));
        console.log(Math.abs(-54));

        //pow()
        console.log(Math.pow(2,5));
        
        //sqrt()
        console.log(Math.sqrt(16));
        console.log(Math.sqrt(64));

        //cbrt()
        console.log(Math.cbrt(27));
        console.log(Math.cbrt(1728));

        //max()
        console.log(Math.max(10,56,98,102,43,144,155));

        //min()
        console.log(Math.min(10,56,98,102,43,144,155));
    </script>
</body>
</html>
