<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="store">

    </div>
    <script>

        //async and await 
        let p = new Promise((res,rej)=>{
            setTimeout(()=>{
                res("promise resolved success")
            },5000);
        });
        async function demo()
        {
            console.log("start");
            let x = await p;
            console.log(x);
            console.log("end");
        }
        demo();

        async function fetchUsers()
        {
            let res = await fetch("https://jsonplaceholder.typicode.com/users");
            console.log(res);
            let data = await res.json();
            console.log(data);

            let store = document.getElementById("store");
            data.map(val=>{
                store.innerHTML +=`
                <h1>${val.name}</h1>
                <p>${val.email}</p>`
            })
        }
        fetchUsers();
    </script>
</body>
</html>
